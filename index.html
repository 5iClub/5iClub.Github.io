    <!-- 复制功能JS代码 -->
    <script>
    function copyLink(link) {
        navigator.clipboard.writeText(link)
            .then(() => alert('直播源地址已复制到剪贴板！'))
            .catch(err => alert('复制失败：' + err));
    }
