<!-- 脚本部分 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>

<script type="text/javascript">
    $(document).ready(function() {
        // 设置目标时间（UTC 时间，对应北京时间2026-01-01 00:00:00）
        const futureDate = new Date('2026-01-01T08:00:00Z');

        let clock;
        
        function updateClock() {
            const now = new Date();
            const diff = Math.floor((futureDate.getTime() - now.getTime()) / 1000);

            if (diff <= 0) {
                if (clock) {
                    clock.stop();
                    $('.message').html('<h5 class="red-text">倒计时已结束！</h5>');
                }
                return;
            }

            if (!clock) {
                // 初始化计时器
                clock = $('.clock').FlipClock(diff, {
                    clockFace: 'Daily',
                    countdown: true,
                    autoStart: true,
                    callbacks: {
                        stop: function() {
                            $('.message').html('<h5 class="green-text">活动进行中！</h5>');
                        }
                    }
                });
            } else {
                // 动态更新时间
                clock.setTime(diff);
                clock.start();
            }
        }

        // 每秒更新并初始化
        updateClock();
        setInterval(updateClock, 1000);

        // 初始化侧边栏
        $('.sidenav').sidenav();
    });
</script>
