    <main style="flex: 1 0 auto;">
        <div class="container">
            <div class="section" style="text-align: center;">
                <div class="clock card-panel hoverable" style="display: inline-block; width: auto;"></div>
                <div class="message"></div>
                <script type="text/javascript">
                    var clock;
                    $(document).ready(function() {
                        // 设置固定目标时间（北京时间2026年1月1日）
                        const futureDate = new Date('2026-01-01T00:00:00+08:00');

                        function updateClock() {
                            const now = new Date();
                            const diff = Math.floor((futureDate - now) / 1000);

                            if (diff <= 0) {
                                if(clock) {
                                    clock.stop();
                                    $('.message').html('<h5 class="red-text">倒计时已结束！</h5>');
                                }
                                return;
                            }

                            if (!clock) {
                                // 初始化时钟
                                clock = $('.clock').FlipClock(diff, {
                                    clockFace: 'DailyCounter',
                                    countdown: true,
                                    autoStart: false,
                                    callbacks: {
                                        stop: function() {
                                            $('.message').html('<h5 class="green-text">活动进行中！</h5>');
                                        }
                                    }
                                }).start();
                            } else {
                                // 动态更新时间
                                clock.setTime(diff);
                                clock.start(); // 确保计时器运行
                            }
                        }

                        // 初始化侧边栏
                        $('.sidenav').sidenav();

                        // 每秒更新
                        setInterval(updateClock, 1000);
                        updateClock(); // 立即初始化
                    });
                </script>
            </div>
        </div>
    </main>
