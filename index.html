<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/css/materialize.min.css">
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/Jing.png"/>
   
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;   
            padding: 40px 0;
        }

        /* --- 仿 Time.is 文字比例 --- */
        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
         /* 動態縮放：最小0.7倍，隨寬度變化，PC端最大鎖定在1.3倍避免過大 */
            transform: scale(clamp(0.65, 8vw, 1.3));
            margin: clamp(40px, 10vh, 100px) 0;
        }
       
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 顏色自定義：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄增強：滑鼠劃過變色與動態下劃線 --- */
        .nav-wrapper ul li a {
            transition: color 0.3s ease, background-color 0.3s ease;
            position: relative;
        }

        .nav-wrapper ul li a:hover {
            color: #ff5252 !important; /* 懸停時變為紅色 */
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        .nav-wrapper ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #ff5252;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-wrapper ul li a:hover::after {
            width: 70%;
        }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper {
                transform: scale(0.85);
                margin: 40px 0;
            }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper {
                transform: scale(0.75);
                margin: 20px 0;
            }
            .header-title { font-size: 1rem !important; }
        }

        /* 頁腳修正 */
        .page-footer {
            padding-top: 20px;
            background-color: #121212 !important;
            transition: background-color 0.3s ease;
        }

        /* 右下角切換按鈕 */
        #theme-toggle-fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
        }
        #theme-toggle-fab a {
            width: 45px;
            height: 45px;
            line-height: 45px;
        }
        #theme-toggle-fab a i {
            line-height: 45px;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }
        #theme-toggle-fab a:hover i {
            transform: rotate(30deg);
        }

        .sidenav { background-color: #212121 !important; }
        .sidenav li a { color: #ffffff !important; }
        .sidenav li a i { color: #ffffff !important; }

        /* --- 淺色模式樣式定義 --- */
        body.light-mode {
            background-color: #f5f5f5 !important;
            color: #212121 !important;
        }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
       
        body.light-mode .nav-wrapper ul li a:hover {
            color: #ff5252 !important;
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        body.light-mode .sub-text { color: #9e9e9e !important; }
        body.light-mode .sidenav { background-color: #ffffff !important; }
        body.light-mode .sidenav li a { color: #424242 !important; }
        body.light-mode .sidenav li a i { color: #424242 !important; }

        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important;
            text-shadow: none !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .page-footer h5, body.light-mode .page-footer p, body.light-mode .footer-copyright { color: #616161 !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
    </style>
</head>

    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>

    <script src="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/js/jquery.min.js"></script>
    <script src="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/js/materialize.min.js"></script>
    <script src="https://fastly.jsdelivr.net/gh/5iClub/5iClub.Github.io@main/js/flipclock.js"></script>
   
    <script type="text/javascript">
        $(document).ready(function() {
            // 1. 初始化 Materialize
            $('.sidenav').sidenav();

            // 2. 主題持久化讀取
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                $('body').addClass('light-mode');
            }

            // 3. 右下角按鈕切換邏輯
            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                const isLight = $('body').hasClass('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });

            // 4. 精確時間獲取
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            // 5. 初始化 FlipClock
            const bjNow = getBeijingTime();
            const clock = $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            // 6. 授時儀式感動畫
            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)')
                           .css('color', '#4caf50')
                           .fadeIn();
                });
            }, 1800);

            setInterval(updateDate, 3600000);
        });
    </script>
