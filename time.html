<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 中國時間</title>

    <style>
        @font-face {
            font-family: 'Noto Serif TC';
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/css/NotoSerifTC.css">
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/css/materialize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/css/flipclock.css">
    <link href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/css/MaterialIcons.css" rel="stylesheet">
    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/LinkCat.png"/>
  
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;  
            padding: 40px 0;
        }

        /* --- Logo 在原位置（左上角）展示 --- */
        .fixed-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .logo-icon {
            height: 36px;
            width: auto;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }

        .logo-icon:hover {
            transform: rotate(15deg) scale(1.1);
        }

        /* --- 移動端 Logo --- */
        @media only screen and (max-width: 768px) {
            .fixed-logo {
                top: 15px;
                left: 15px;
            }
            .logo-icon {
                height: 32px;
            }
        }

        @media only screen and (max-width: 480px) {
            .fixed-logo {
                top: 12px;
                left: 12px;
            }
            .logo-icon {
                height: 28px;
            }
        }

        /* --- 文青風格標題 --- */
        .header-title {
            font-family: 'Noto Serif TC', serif !important;
            font-size: 1.6rem !important;
            font-weight: 600;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 6px;
            text-shadow: 2px 2px 8px rgba(255, 82, 82, 0.2),
                                 1px 1px 2px rgba(0, 0, 0, 0.3);
            line-height: 1.5;
            writing-mode: horizontal-tb;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 15px;
        }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            transform: scale(clamp(0.65, 8vw, 1.3));
            margin: clamp(20px, 8vh, 60px) 0;
        }
      
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
            backface-visibility: hidden;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 響應式微調 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.85); margin: 30px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.75); margin: 20px 0; }
            .header-title { font-size: 1.4rem !important; }
        }

        /* 頁腳 */
        .page-footer {
            padding-top: 20px;
            background-color: #121212 !important;
            transition: background-color 0.3s ease;
        }

        #hitokoto_text { font-style: italic; transition: opacity 0.5s ease; }
        #hitokoto_from { font-size: 0.8rem; margin-left: 10px; }

        /* 切換按鈕 */
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
        #theme-toggle-fab a { width: 45px; height: 45px; line-height: 45px; }
        #theme-toggle-fab a i { line-height: 45px; font-size: 1.5rem; transition: transform 0.3s ease; }
        #theme-toggle-fab a:hover i { transform: rotate(30deg); }

        /* 簡化淺色模式 */
        body.light-mode {
            background-color: #f5f5f5 !important;
            color: #212121 !important;
        }

        body.light-mode .sub-text { color: #424242 !important; }
        body.light-mode #bj-date { color: #212121 !important; }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important;
            text-shadow: none !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
        body.light-mode .page-footer p, body.light-mode .page-footer h6 a { color: #212121 !important; }
       
        #sync-status { cursor: pointer; user-select: none; }
        #sync-status:hover { filter: brightness(1.2); }
    </style>
</head>

<body>
    <!-- Logo 固定在左上角 -->
    <div class="fixed-logo">
        <img src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/LinkCat.png" alt="Logo" class="logo-icon">
    </div>

    <!-- 主题切换按钮 -->
    <div id="theme-toggle-fab">
        <a class="btn-floating waves-effect waves-light red">
            <i class="material-icons">brightness_medium</i>
        </a>
    </div>
  
    <main>
        <div class="container center-align">
            <h1 class="header-title">"閒"是生活的標點</h1>
            <p class="sub-text">"LEISUER" IS THE HALLMARK OF LIFE</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px; font-weight: 300;"></div>
            <div id="sync-status" title="點擊手動校準時間" style="font-size: 0.85rem; transition: all 0.5s ease; color: #ff5252;">互聯網校準授時中...</div>
          
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h6 style="color:#ff5252;">鯉躍龍門</h6>
                    <p class="grey-text text-lighten-1">
                        「<span id="hitokoto_text">人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了</span>」
                        <small id="hitokoto_from">—— 魯迅</small>
                    </p>
                </div>
            </div>
        </div>
        <div class="footer-copyright black">
            <div class="container grey-text text-darken-1">
                &copy; 2022-<span id="current-year"></span> 蜂巢·隱曜
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/js/jquery.min.js"></script>
    <script src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/js/materialize.min.js"></script>
    <script src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/js/flipclock.js"></script>
  
    <script type="text/javascript">
        $(document).ready(function() {
            // 自動更新版權年份
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const savedTheme = localStorage.getItem('theme');
           
            function applyAutoTheme() {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 18) {
                    $('body').addClass('light-mode');
                } else {
                    $('body').removeClass('light-mode');
                }
            }

            if (!savedTheme) {
                applyAutoTheme();
            } else if (savedTheme === 'light') {
                $('body').addClass('light-mode');
            }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            // 名句獲取函式
            function fetchHitokoto() {
                fetch('https://v1.hitokoto.cn')
                    .then(response => response.json())
                    .then(data => {
                        $('#hitokoto_text').fadeOut(300, function() {
                            $(this).text(data.hitokoto).fadeIn(300);
                        });
                        if (data.from) {
                            $('#hitokoto_from').fadeOut(300, function() {
                                $(this).text('—— ' + data.from).fadeIn(300);
                            });
                        }
                    })
                    .catch(console.error);
            }

            fetchHitokoto();
            setTimeout(function() { fetchHitokoto(); }, 6000);  
            setInterval(function() { fetchHitokoto(); }, 60000); 

            let timeOffset = 0;

            function getBeijingTime() {
                const now = new Date();
                const correctedNow = new Date(now.getTime() + timeOffset);
                const utc = correctedNow.getTime() + (correctedNow.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const clock = $('.clock').FlipClock(getBeijingTime(), {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            async function syncWithNTP() {
                const apis = [
                    { name: '蘇寧易購', url: 'https://quan.suning.com/getSysTime.do', parser: (d) => new Date(d.datetime).getTime() }
                ];

                let success = false;
                for (let api of apis) {
                    try {
                        const startTime = Date.now();
                        const response = await fetch(api.url, { cache: 'no-store' });
                        if (!response.ok) continue;
                        const data = await response.json();
                        const serverTime = api.parser(data);
                        const endTime = Date.now();
                        const latency = (endTime - startTime) / 2;
                        timeOffset = (serverTime + latency) - endTime;
                        if (Math.abs(timeOffset) > 1000) clock.setTime(getBeijingTime());
                        $('#sync-status').fadeOut(500, function() {
                            $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">cloud_done</i> 蜂巢時間同步成功 (互聯網校準時間)')
                                   .css('color', '#4caf50').fadeIn();
                        });
                        success = true;
                        break;
                    } catch (e) { console.warn(api.name + ' 接口失效...'); }
                }
                if (!success) {
                    $('#sync-status').html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">cloud_off</i> 蜂巢時間同步失敗 (本地系統時間)').css('color', '#ff9800');
                }
            }

            $('#sync-status').on('click', function() {
                $(this).fadeOut(200, function() {
                    $(this).text('正在重新校準時間...').css('color', '#ff5252').fadeIn(200);
                    syncWithNTP();
                });
            });

            setTimeout(syncWithNTP, 1800);

            setInterval(() => {
                updateDate();
                syncWithNTP();
                if (!localStorage.getItem('theme')) applyAutoTheme();
            }, 3600000);
        });
    </script>
</body>
</html>
