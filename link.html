<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件直链托管 · 稳定版</title>

    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTCoffe/iTCoffe.Github.io@List/Gbastos.png" sizes="32x32">
    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTCoffe/iTCoffe.Github.io@List/Gbastos.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="https://cdn.jsdmirror.com/gh/iTCoffe/iTCoffe.Github.io@List/Gbastos.png">
    <link rel="shortcut icon" href="https://cdn.jsdmirror.com/gh/iTCoffe/iTCoffe.Github.io@List/Gbastos.png" type="image/png">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 10px 40px rgba(99, 102, 241, 0.1);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --upload-bg: rgba(248, 250, 252, 0.8);
            --upload-hover: rgba(255, 255, 255, 0.9);
            --dragover-bg: rgba(99, 102, 241, 0.05);
            --input-bg: #f8fafc;
        }
        .dark-mode {
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --primary-dark: #6366f1;
            --secondary: #f472b6;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(71, 85, 105, 0.8);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --upload-bg: rgba(30, 41, 59, 0.8);
            --upload-hover: rgba(30, 41, 59, 0.9);
            --dragover-bg: rgba(99, 102, 241, 0.1);
            --input-bg: #1e293b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: var(--text-primary);
            padding: 20px;
            overflow-x: hidden;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            color: var(--primary);
            font-size: 20px;
        }
        .theme-toggle:hover { transform: scale(1.05); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            color: var(--text-primary);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(-50%) translateY(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .header {
            text-align: center;
            width: 100%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 4px solid var(--card-bg);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
            transition: transform 0.4s ease;
            object-fit: cover;
        }
        .avatar:hover { transform: scale(1.08) rotate(2deg); }
        .title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 45px rgba(99, 102, 241, 0.15);
        }
        .file-info {
            margin-bottom: 16px;
            text-align: center;
            display: none;
            padding: 12px;
            background: var(--upload-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .file-info p {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .file-info small {
            font-size: 12px;
            color: var(--text-secondary);
        }
        /* 修复：将 .upload-area 作为拖拽区域的主类 */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            background: var(--upload-bg);
        }
        .upload-area:hover {
            border-color: var(--primary-light);
            background: var(--upload-hover);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--dragover-bg);
            transform: scale(1.02);
        }
        /* 上传信息样式 */
        .upload-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            line-height: 1.6;
        }
        .upload-icon {
            font-size: 56px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .upload-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .upload-hint {
            font-size: 12px;
            color: #94a3b8;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }
        .btn:hover {
            background: linear-gradient(135deg, var(--primary-dark), #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(99, 102, 241, 0.05);
            color: var(--primary-dark);
        }
        .progress-section, .result-section, .history-section {
            display: none;
            margin-top: 24px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-title {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-align: center;
        }
        .progress-bar {
            height: 8px;
            background: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-percent {
            text-align: center;
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
        }
        .retry-notice {
            font-size: 12px;
            color: var(--warning);
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .result-item {
            margin-bottom: 20px;
        }
        .result-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }
        .result-input-group {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2px;
        }
        .result-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .copy-btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .copy-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .copy-btn:active::after {
            width: 200px;
            height: 200px;
            opacity: 0;
        }
        .copy-btn:hover { background: var(--primary-dark); }
        .history-section { margin-top: 32px; }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .history-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .clear-history {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
        }
        .clear-history:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .history-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .history-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .history-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .history-buttons {
            display: flex;
            gap: 8px;
        }
        .history-btn {
            font-size: 12px;
            padding: 4px 8px;
            background: var(--primary-light);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .history-btn:hover { background: var(--primary); }
        #fileInput { display: none; }
        @media (max-width: 480px) {
            .container { padding: 10px; }
            .card { padding: 24px 16px; }
            .upload-area { padding: 32px 16px; }
            .title { font-size: 28px; }
            .theme-toggle { width: 40px; height: 40px; font-size: 18px; }
        }
        @media (max-width: 375px) {
            .card { padding: 20px 12px; }
            .upload-area { padding: 32px 12px; }
            .title { font-size: 24px; }
            .theme-toggle { width: 36px; height: 36px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="theme-toggle" id="themeToggle">🌞</div>
    <div class="toast" id="toast"></div>

    <div class="container">
        <div class="header">
            <img src="https://cdn.jsdmirror.com/gh/iTCoffe/iTCoffe.Github.io@List/Gbastos.png" alt="头像" class="avatar">
            <h1 class="title">文件直链托管 · 稳定版</h1>
            <p class="subtitle">稳定可靠的文件直链生成服务 · 永久保存 · 最大支持200MB</p>
        </div>

        <div class="card">
            <div class="file-info" id="fileInfo">
                <p>📄 待上传：<span id="fileName"></span></p>
                <small>大小：<span id="fileSize"></span> | 格式：<span id="fileType"></span></small>
            </div>

            <div id="uploadForm">
                <!-- 修复：class 从 upload-zone 改为 upload-area，以应用正确的样式和拖拽高亮 -->
                <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 40px;">📂</div>
                    <p style="font-size: 14px; font-weight: 600; margin-top: 8px;">点击或拖拽上传</p>
                    <div class="upload-info">
                        ✅ 不限格式 · 📦 200MB内<br>
                        ☁️ 永久储存 · ⚡ 加速通道
                    </div>
                    <input type="file" id="fileInput" hidden>
                </div>
                <button class="btn" onclick="document.getElementById('fileInput').click()">立即上传文件</button>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="loading-spinner"></div>
                <p class="progress-title" id="progressStatus">正在上传到云端服务器...</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <p class="progress-percent" id="percentText">0%</p>
                <p class="retry-notice" id="retryNotice">⚠️ 当前通道繁忙，正在切换备用线路(优先使用国内节点)...</p>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-item">
                    <label class="result-label">🚀 镜像加速链接</label>
                    <div class="result-input-group">
                        <input type="text" id="proxyLink" class="result-input" readonly>
                        <button class="copy-btn" onclick="copyValue('proxyLink', this)">复制</button>
                    </div>
                </div>
                <div class="result-item">
                    <label class="result-label">🔗 原始官方链接</label>
                    <div class="result-input-group">
                        <input type="text" id="rawLink" class="result-input" readonly>
                        <button class="copy-btn" onclick="copyValue('rawLink', this)">复制</button>
                    </div>
                </div>
                <button class="btn btn-outline" onclick="location.reload()">重新上传</button>
            </div>

            <div class="history-section" id="historySection">
                <div class="history-header">
                    <h3 class="history-title">上传历史</h3>
                    <button class="clear-history" onclick="clearHistory()">清空记录</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const MAX_FILE_SIZE = 200 * 1024 * 1024;
            const FORBIDDEN_TYPES = ['exe', 'bat', 'sh', 'php', 'js', 'py', 'asp', 'aspx', 'jsp'];

            // 主题切换
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                body.classList.add('dark-mode');
                themeToggle.textContent = '🌙';
            } else {
                themeToggle.textContent = '🌞';
            }

            themeToggle.addEventListener('click', () => {
                if (body.classList.contains('dark-mode')) {
                    body.classList.remove('dark-mode');
                    themeToggle.textContent = '🌞';
                    localStorage.setItem('theme', 'light');
                } else {
                    body.classList.add('dark-mode');
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });

            // 全局阻止拖拽默认行为（避免浏览器打开文件）
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());

            // Toast 提示
            function showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // 历史记录
            function saveUploadHistory(fileName, rawLink, proxyLink) {
                const history = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
                history.unshift({
                    id: Date.now(),
                    name: fileName,
                    raw: rawLink,
                    proxy: proxyLink,
                    time: new Date().toLocaleString()
                });
                if (history.length > 10) history.pop();
                localStorage.setItem('uploadHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                const history = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
                const historyList = document.getElementById('historyList');
                const historySection = document.getElementById('historySection');
                
                if (history.length === 0) {
                    historySection.style.display = 'none';
                    return;
                }
                
                historySection.style.display = 'block';
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <p class="history-name">${escapeHtml(item.name)}</p>
                        <p class="history-time">${escapeHtml(item.time)}</p>
                        <div class="history-buttons">
                            <button class="history-btn" onclick="copyHistoryLink('${item.raw.replace(/'/g, "\\'")}')">复制原始链接</button>
                            <button class="history-btn" onclick="copyHistoryLink('${item.proxy.replace(/'/g, "\\'")}')">复制加速链接</button>
                        </div>
                    </div>
                `).join('');
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"']/g, function(m) {
                    if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;';
                    if(m === '"') return '&quot;'; if(m === "'") return '&#039;';
                    return m;
                });
            }

            window.copyHistoryLink = function(link) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(link).then(() => {
                        showToast('链接复制成功！', 'success');
                    }).catch(() => {
                        fallbackCopyText(link);
                    });
                } else {
                    fallbackCopyText(link);
                }
            };
            
            function fallbackCopyText(text) {
                const tempInput = document.createElement('textarea');
                tempInput.value = text;
                tempInput.style.position = 'fixed';
                tempInput.style.opacity = 0;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast('链接复制成功！', 'success');
                } catch (err) {
                    showToast('复制失败，请手动复制', 'error');
                }
                document.body.removeChild(tempInput);
            }

            window.clearHistory = function() {
                if (confirm('确定要清空所有上传记录吗？')) {
                    localStorage.removeItem('uploadHistory');
                    renderHistory();
                    showToast('上传记录已清空', 'info');
                }
            };

            // DOM 元素
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            const progressSection = document.getElementById('progressSection');
            const resultSection = document.getElementById('resultSection');
            const uploadForm = document.getElementById('uploadForm');
            const fileInfo = document.getElementById('fileInfo');
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const fileTypeEl = document.getElementById('fileType');
            const progressBar = document.getElementById('progressBar');
            const percentText = document.getElementById('percentText');
            const retryNotice = document.getElementById('retryNotice');
            const progressStatus = document.getElementById('progressStatus');

            // 隐藏文件信息并清空内容
            function hideFileInfo() {
                fileInfo.style.display = 'none';
                fileNameEl.textContent = '';
                fileSizeEl.textContent = '';
                fileTypeEl.textContent = '';
            }

            // 初始隐藏
            hideFileInfo();

            window.addEventListener('load', () => {
                renderHistory();
            });

            // 文件验证
            function validateFile(file) {
                if (file.size > MAX_FILE_SIZE) {
                    showToast(`文件大小超过限制！最大支持200MB，当前：${(file.size/1024/1024).toFixed(2)}MB`, 'error');
                    return false;
                }
                
                const fileExt = file.name.split('.').pop()?.toLowerCase() || '';
                if (FORBIDDEN_TYPES.includes(fileExt)) {
                    showToast('禁止上传可执行/脚本文件！', 'error');
                    return false;
                }
                
                return true;
            }

            // 拖拽事件
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
            });

            dropZone.addEventListener('drop', handleDrop, false);
            dropZone.addEventListener('click', () => fileInput.click());
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    const file = e.target.files[0];
                    if (validateFile(file)) {
                        showFileInfo(file);
                        handleUpload(file);
                    } else {
                        hideFileInfo(); // 验证失败时隐藏文件信息
                    }
                }
            });

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length) {
                    const file = files[0];
                    if (validateFile(file)) {
                        showFileInfo(file);
                        handleUpload(file);
                    } else {
                        hideFileInfo(); // 验证失败时隐藏文件信息
                    }
                }
            }

            function showFileInfo(file) {
                const fileExt = file.name.split('.').pop()?.toLowerCase() || '未知';
                const fileSize = (file.size/1024/1024).toFixed(2) + 'MB';
                
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = fileSize;
                fileTypeEl.textContent = fileExt;
                fileInfo.style.display = 'block';
            }

            // ----- 核心上传逻辑，代理池已按国内网络优化排序 -----
            const API = 'https://catbox.moe/user/api.php';
            const DOMAIN = 'https://cors.ifanr.pp.ua/';   // 镜像加速域名

            // 优化后的代理池顺序（国内用户优先）
            const PROXY_POOL = [
                'https://cors.eu.org/',                     // 首选，国内速度较好
                'https://cors-proxy.fringe.zone/',          // 次选，对国内较友好
                'https://corsproxy.io/?',                   // 国际稳定备用
                'https://api.allorigins.win/raw?url='       // 最后手段
            ];

            let currentXHR = null;

            function resetProgress() {
                progressBar.style.width = '0%';
                percentText.innerText = '0%';
                retryNotice.style.display = 'none';
                progressStatus.innerText = '正在上传到云端服务器...';
            }

            function handleUpload(file) {
                uploadForm.style.display = 'none';
                progressSection.style.display = 'block';
                resultSection.style.display = 'none';
                resetProgress();

                let currentProxyIndex = 0;

                function tryNext() {
                    currentProxyIndex++;
                    if (currentProxyIndex < PROXY_POOL.length) {
                        retryNotice.style.display = 'block';
                        progressStatus.innerText = `尝试备用线路 (${currentProxyIndex}/${PROXY_POOL.length-1})...`;
                        progressBar.style.width = '0%';
                        percentText.innerText = '0%';
                        startAjax();
                    } else {
                        showToast('所有代理线路均不可用，请稍后重试或更换网络', 'error');
                        setTimeout(() => location.reload(), 1500);
                    }
                }

                function startAjax() {
                    if (currentXHR) {
                        currentXHR.abort();
                        currentXHR = null;
                    }

                    const xhr = new XMLHttpRequest();
                    currentXHR = xhr;

                    const baseProxy = PROXY_POOL[currentProxyIndex];
                    const targetUrl = baseProxy + encodeURIComponent(API);

                    xhr.open('POST', targetUrl);
                    xhr.timeout = 120000; // 2分钟

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressBar.style.width = percent + '%';
                            percentText.innerText = percent + '%';
                        }
                    };

                    xhr.onload = () => {
                        currentXHR = null;
                        const response = xhr.responseText.trim();
                        if (xhr.status === 200 && response.includes('http')) {
                            const urlMatch = response.match(/https?:\/\/[^\s]+/);
                            if (urlMatch) {
                                const raw = urlMatch[0];
                                const noProtocol = raw.replace(/^https?:\/\//, '');
                                document.getElementById('rawLink').value = raw;
                                document.getElementById('proxyLink').value = DOMAIN + noProtocol;

                                saveUploadHistory(file.name, raw, DOMAIN + noProtocol);

                                progressSection.style.display = 'none';
                                resultSection.style.display = 'block';
                                showToast('上传成功！', 'success');
                                return;
                            }
                        }
                        console.warn(`代理 ${baseProxy} 返回异常:`, response.substring(0,200));
                        tryNext();
                    };

                    xhr.onerror = () => {
                        currentXHR = null;
                        console.error(`代理 ${baseProxy} 网络错误`);
                        tryNext();
                    };

                    xhr.ontimeout = () => {
                        currentXHR = null;
                        console.warn(`代理 ${baseProxy} 超时`);
                        tryNext();
                    };

                    const fd = new FormData();
                    fd.append('reqtype', 'fileupload');
                    fd.append('fileToUpload', file);

                    try {
                        xhr.send(fd);
                    } catch (err) {
                        currentXHR = null;
                        console.error('send error', err);
                        tryNext();
                    }
                }

                startAjax();
            }

            // 复制功能
            window.copyValue = function(id, btn) {
                const input = document.getElementById(id);
                if (!input.value) {
                    showToast('无内容可复制', 'warning');
                    return;
                }

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(input.value).then(() => {
                        btnSuccess(btn);
                        showToast('复制成功！', 'success');
                    }).catch(() => {
                        fallbackCopyBtn(input.value, btn);
                    });
                } else {
                    fallbackCopyBtn(input.value, btn);
                }
            };

            function btnSuccess(btn) {
                const originalText = btn.textContent;
                btn.textContent = '已复制 ✓';
                btn.style.background = 'var(--success)';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }

            function fallbackCopyBtn(value, btn) {
                const tempInput = document.createElement('textarea');
                tempInput.value = value;
                tempInput.style.position = 'fixed';
                tempInput.style.opacity = 0;
                document.body.appendChild(tempInput);
                tempInput.select();
                
                try {
                    document.execCommand('copy');
                    btnSuccess(btn);
                    showToast('复制成功！', 'success');
                } catch (err) {
                    showToast('复制失败，请手动复制', 'error');
                }
                
                document.body.removeChild(tempInput);
            }

            // 页面卸载前取消请求
            window.addEventListener('beforeunload', function() {
                if (currentXHR) {
                    currentXHR.abort();
                }
            });
        })();
    </script>
</body>
</html>
